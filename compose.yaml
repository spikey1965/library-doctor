# Library Doctor - example Docker Compose file. Change the three things marked CHANGE.
services:
  library-doctor:
    image: ghcr.io/spikey1965/library-doctor:latest
    container_name: library-doctor
    restart: unless-stopped
    ports:
      - "8790:8790"
    environment:
      - PUID=1000                   # CHANGE: the user and group that own your media folders
      - PGID=1000                   #         (find them with: ls -ln /path/to/media)
      - TZ=Europe/London            # CHANGE: your time zone (the nightly scan runs at 03:00 local time)
      - LD_SCAN_HOUR=3              # hour of the nightly scan
      - LD_TRASH_DAYS=7             # how long cleaned-up files stay in the trash before they're deleted
      # - LD_AUTH=off               # only if another login (Authentik, Authelia, your proxy) protects this page
      # - LD_TRUSTED_PROXIES=172.16.0.0/12   # behind a reverse proxy: its address or range
      # - LD_ALLOWED_HOSTS=ld.example.com    # the name you open it by (strongly recommended with LD_AUTH=off)
      # - LD_CLAMD_HOST=clamav      # optional: your ClamAV (clamd) for the Virus Scan check
      # - LD_CLAMD_PORT=3310
      # - LD_CLAM_ROOT=/scandir     # where ClamAV sees the same media folder
      # - LD_DOWNLOAD_WINDOW_END=7  # optional: if downloads only run at night, the hour that window ends
    volumes:
      - ./config:/config            # settings, password and the database live here
      # CHANGE: your media folder. Mount it read-write: clean-up moves files into a .library-doctor-trash folder
      # inside it (same disk, so it's instant and nothing is copied).
      - /path/to/media:/media
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
