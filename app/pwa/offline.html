<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="ld-offline" content="1"><title>Library Doctor</title>
<style>:root{--bg:#0d1830;--fg:#eef3fb;--mut:#9fb0c9;--teal:#2bc6b4;--ink:#0d1830;color-scheme:dark}@media(prefers-color-scheme:light){:root{--bg:#f3f6fb;--fg:#14202e;--mut:#56677c;--teal:#0b8577;--ink:#fff;color-scheme:light}}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;text-align:center}main{max-width:360px;padding:24px}img{width:72px;height:72px;border-radius:16px}h1{font-size:22px;margin:16px 0 6px}p{color:var(--mut);margin:0 0 20px}button{font:600 16px system-ui,sans-serif;min-height:48px;padding:0 28px;border:0;border-radius:12px;background:var(--teal);color:var(--ink)}</style></head>
<body><main><img src="/pwa/icon-192.png" alt=""><h1>Can't reach your server</h1><p>Library Doctor runs on your own server. Check that it's on, and that you're on your home network or VPN.</p><button type="button" onclick="location.replace('/')">Try again</button></main></body></html>
