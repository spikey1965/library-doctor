<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<!--pwa--><link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials"><link rel="apple-touch-icon" href="/pwa/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Library Doctor">
<meta name="theme-color" content="#0d1830" media="(prefers-color-scheme: dark)"><meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)"><!--/pwa-->
<title>Library Doctor</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&display=swap">
<style>
:root { --bg:#0d1830; --panel:#14213a; --card:#1b2c49; --line2:#3a5583; --fg:#eef3fb; --mut:#9fb0c9; --teal:#2bc6b4; --teal-bg:#123e45; --red:#ff7b7b; --red-bg:#3e1d27;
  --head:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --font:system-ui,-apple-system,"Segoe UI",sans-serif; color-scheme:dark; }
* { box-sizing:border-box; } [hidden] { display:none !important; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:15px/1.5 var(--font); padding:16px; }
.box { width:100%; max-width:380px; background:var(--panel); border-radius:18px; padding:26px 24px; display:flex; flex-direction:column; gap:14px; }
.logo { display:flex; align-items:center; gap:10px; font:800 22px var(--head); } .logo svg { width:30px; height:30px; }
h1 { margin:0; font:800 20px var(--head); } p { margin:0; color:var(--mut); font-size:14px; }
label { display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:700; color:var(--mut); }
input { font:inherit; font-size:15px; background:var(--card); color:var(--fg); border:1px solid var(--line2); border-radius:11px; padding:10px 12px; width:100%; }
input:focus, button:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
button { font:700 15px var(--font); background:var(--teal); color:var(--bg); border:0; border-radius:11px; padding:11px 14px; cursor:pointer; }
button:disabled { opacity:.6; cursor:default; }
.pwrap { position:relative; display:block; } .pwrap input { padding-right:64px; }
.eye { position:absolute; right:6px; top:50%; transform:translateY(-50%); font:700 12px var(--font); background:transparent; color:var(--teal); border:1px solid var(--line2); border-radius:8px; padding:4px 9px; cursor:pointer; }
.msg { font-size:13px; border-radius:10px; padding:8px 11px; background:var(--red-bg); color:var(--red); } .msg[hidden] { display:none; }
</style></head>
<body>
<form class="box" id="f" autocomplete="on">
  <div class="logo"><svg viewBox="0 0 64 64" aria-hidden="true"><mask id="ldp" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64"><rect width="64" height="64" fill="#fff"/><path d="M-2 38h14.8l8.1-9.5 6.9 22.7 8.1-18.6 4.7 5.4H66" fill="none" stroke="#000" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/></mask><g mask="url(#ldp)"><rect x="4" y="11.4" width="12.3" height="46" rx="4.6" fill="#2bc6b4"/><rect x="18.6" y="18.8" width="12.3" height="38.6" rx="4.6" fill="#2bc6b4"/><rect x="33.2" y="6.5" width="12.3" height="50.9" rx="4.6" fill="#2bc6b4"/><rect x="47.7" y="23.6" width="12.3" height="33.8" rx="4.6" fill="#ff8b3d"/></g></svg>Library Doctor</div>
  <h1 id="h">Log in</h1>
  <p id="sub">Enter your Library Doctor password.</p>
  <input type="text" name="username" value="library-doctor" autocomplete="username" hidden>
  <label id="l1">Password<input type="password" id="pw" autocomplete="current-password" required></label>
  <label id="l2" hidden>Type it again<input type="password" id="pw2" autocomplete="new-password"></label>
  <div class="msg" id="msg" role="alert" hidden></div>
  <button id="go">Log in</button>
</form>
<script>
// Show/Hide button on every password box. One press shows every password box in the same form, so two copies can be compared.
function ldEyes(root) {
  root.querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp => {
    inp.dataset.eye = "1";
    const w = document.createElement("span"); w.className = "pwrap";
    inp.parentNode.insertBefore(w, inp); w.appendChild(inp);
    const b = document.createElement("button"); b.type = "button"; b.className = "eye";
    b.textContent = "Show"; b.setAttribute("aria-pressed", "false"); b.setAttribute("aria-label", "Show password");
    w.appendChild(b);
    b.onclick = ev => {
      ev.preventDefault();
      const show = inp.type === "password", grp = inp.closest("form, .fl") || w;
      grp.querySelectorAll("input[data-eye]").forEach(i => {
        i.type = show ? "text" : "password";
        const e = i.parentNode.querySelector(".eye");
        e.textContent = show ? "Hide" : "Show"; e.setAttribute("aria-pressed", String(show)); e.setAttribute("aria-label", (show ? "Hide" : "Show") + " password");
      });
      inp.focus();
    };
  });
}
ldEyes(document);
(async function () {
  const $ = id => document.getElementById(id);
  let setup = false;
  try { const a = await (await fetch("/api/auth", { cache: "no-store" })).json();
    if (a.in) { location.replace(/^#[a-z-]{1,30}$/.test(location.hash) ? "/?in=1" + location.hash : "/");   /* ?in=1: the login page lives at / too, so a new # alone would not reload */ return; }
    setup = a.on && !a.has_password; } catch (e) {}
  if (setup) {
    $("h").textContent = "Create a password"; $("sub").textContent = "This protects Library Doctor, because it can move files. Use at least 10 characters.";
    $("pw").autocomplete = "new-password"; $("l2").hidden = false; $("pw2").required = true; $("go").textContent = "Create password";
  }
  $("pw").focus();
  $("f").onsubmit = async ev => {
    ev.preventDefault(); const m = $("msg"); m.hidden = true;
    if (setup && $("pw").value !== $("pw2").value) { m.textContent = "The two passwords don't match."; m.hidden = false; return; }
    $("go").disabled = true;
    try {
      const r = await fetch(setup ? "/api/auth/setup" : "/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-LD": "1" }, body: JSON.stringify({ password: $("pw").value }) });
      const j = await r.json();
      if (j.ok) { location.replace(/^#[a-z-]{1,30}$/.test(location.hash) ? "/?in=1" + location.hash : "/");   /* ?in=1: the login page lives at / too, so a new # alone would not reload */ return; }
      m.textContent = j.msg || "That didn't work."; m.hidden = false;
    } catch (e) { m.textContent = "Can't reach Library Doctor."; m.hidden = false; }
    $("go").disabled = false;
  };
})();
</script>
